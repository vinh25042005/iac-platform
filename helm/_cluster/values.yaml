# ============================================================================
# helm/_cluster/values.yaml — Component cấp CLUSTER (cài 1 lần mỗi cluster)
# Copy cấu hình subchart từ deploy-web/helm/techshop/values.yaml khi cần:
#   - ingress-nginx: hostNetwork DaemonSet + metrics
#   - kube-prometheus-stack: grafana + prometheus (tắt webhook/alertmanager)
#   - metrics-server: --kubelet-insecure-tls
#   - aws-ebs-csi-driver: gp3 StorageClass (hoặc để Terraform cài)
#   - cert-manager: selfsigned ClusterIssuer
# ============================================================================

# Mặc định BẬT các component nền tảng
kube-prometheus-stack:
  enabled: true
ingress-nginx:
  enabled: true
metrics-server:
  enabled: true
aws-ebs-csi-driver:
  enabled: true
cert-manager:
  enabled: true
  installCRDs: true

# ── Lưu ý bảo mật ──
# Grafana admin password KHÔNG set ở đây — đọc từ Vault qua Vault Agent Injector
# (xem helm/_base templates + deploy-web/helm/techshop values.yaml).
