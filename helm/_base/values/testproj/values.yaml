# ============================================================================
# Ví dụ values cho 1 project — mọi project chỉ cần sửa TẬP FILE NÀY,
# KHÔNG đụng vào template code của helm/_base.
#
# Cách dùng:
#   1. scripts/new-project.sh <PROJECT>   (tự sinh bản cho project bạn)
#   2. Sửa các giá trị dưới đây cho hợp dự án
# ============================================================================

global:
  project: testproj        # ← TÊN PROJECT (tên resource, vault role, image name)

env: dev

images:
  repo: docker.io/youruser  # ← registry user/org của công ty
  tag: latest

vault:
  addr: https://52.221.18.86:8200    # ← Vault address
  role: myproject                    # Vault k8s auth role (mặc định = project)
  # caConfigMap: vault-ca            # nếu Vault dùng TLS self-signed (import CA)
  tlsSkipVerify: true
  secrets:                           # path kv-v2 trong Vault
    postgres: secret/data/postgres
    jwt: secret/data/jwt
    grafana: secret/data/grafana

postgres:
  database: shopdb
  backup:
    s3Bucket: myproject-backup       # ← bucket backup riêng cho project
    s3Region: ap-southeast-1

config:
  frontendUrl: http://myproject.local

ingress:
  host: myproject.local

monitoring:
  grafanaHost: grafana.myproject.local
