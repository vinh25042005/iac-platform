# ============================================================================
# Ví dụ values cho 1 project — mọi project chỉ cần sửa TẬP FILE NÀY,
# KHÔNG đụng vào template code của helm/_base.
#
# Cách dùng:
#   1. scripts/new-project.sh <PROJECT>   (tự sinh bản cho project bạn)
#   2. Sửa các giá trị dưới đây cho hợp dự án
# ============================================================================

global:
  project: test123        # ← TÊN PROJECT (tên resource, vault role, image name)

env: dev

images:
  repo: docker.io/vinh2504  # ← registry user/org của công ty
  tag: latest
  # Dùng image CÓ SẴN (từ dự án deploy-web) — chưa build image riêng cho test123.
  # Khi có image riêng (<repo>/test123-backend) thì bỏ 2 dòng này.
  backend: docker.io/vinh2504/deploy-web-backend:stg
  frontend: docker.io/vinh2504/deploy-web-frontend:stg

vault:
  addr: https://52.221.18.86:8200    # ← Vault address
  role: test123                    # Vault k8s auth role (mặc định = project)
  # caConfigMap: vault-ca            # nếu Vault dùng TLS self-signed (import CA)
  tlsSkipVerify: true
  secrets:                           # path kv-v2 trong Vault
    postgres: secret/data/postgres
    jwt: secret/data/jwt
    grafana: secret/data/grafana

postgres:
  database: shopdb
  backup:
    s3Bucket: test123-backup       # ← bucket backup riêng cho project
    s3Region: ap-southeast-1

config:
  frontendUrl: http://test123.local

ingress:
  host: test123.local

monitoring:
  grafanaHost: grafana.test123.local
