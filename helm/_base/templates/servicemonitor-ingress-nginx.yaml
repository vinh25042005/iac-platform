{{- if and .Values.monitoring.enabled .Values.storage.ebsCSI.enabled }}
# ─── ServiceMonitor cho ingress-nginx controller ───
# Prometheus (kube-prometheus-stack) chọn ServiceMonitor theo label "release: <release>"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx-controller
  namespace: {{ include "base.namespace" . }}
  labels:
    release: {{ .Release.Name }}
    app.kubernetes.io/name: ingress-nginx
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
  namespaceSelector:
    matchNames:
      - {{ include "base.namespace" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
{{- end }}
