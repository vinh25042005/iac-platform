{{- if and .Values.monitoring.enabled .Values.backend.enabled }}
# ─── AnalysisTemplate: đánh giá sức khỏe version mới trong canary bằng Prometheus ───
# Query đo tỷ lệ 5xx + latency p95 của traffic vào service "backend" (route /api).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate
  namespace: {{ include "base.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # tạo trước Rollout (sync-wave 1)
spec:
  metrics:
    # success khi < 1%; fail khi >= 5% (3 lần liên tiếp → auto rollback về stable)
    - name: error-rate
      interval: 15s
      count: 4                 # 4 × 15s = 60s — bắt buộc, nếu thiếu chạy vô hạn
      successCondition: result[0] < 0.01
      failureCondition: result[0] >= 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: {{ .Values.monitoring.prometheusAddress | default (printf "http://%s-kube-promethe-prometheus:9090" .Release.Name) }}
          query: |
            # F5 NGINX Ingress Controller: metric location_zone (per service).
            # Hedge __name__ giữa nginx_ingress_location_zone_* / nginxplus_location_zone_*.
            (
              sum(rate({__name__=~"nginx(_ingress|plus)?_location_zone_responses_codes", location_zone=~"{{ include "base.namespace" . }}-backend-.*", code="5xx"}[2m]))
              /
              clamp_min(sum(rate({__name__=~"nginx(_ingress|plus)?_location_zone_requests", location_zone=~"{{ include "base.namespace" . }}-backend-.*"}[2m])), 1)
            ) or vector(0)
{{- end }}
