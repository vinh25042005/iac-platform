{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-restart-alert
  namespace: {{ include "base.namespace" . }}
  labels:
    release: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: {{ .Values.monitoring.ruleGroupName | default (include "base.fullname" .) }}
      rules:
        - alert: PodRestartHigh
          expr: rate(kube_pod_container_status_restarts_total{namespace="{{ include "base.namespace" . }}"}[3m]) * 600 > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{ $labels.pod }}" }} restart nhiều"
            description: "Pod {{ "{{ $labels.pod }}" }} trong namespace {{ "{{ $labels.namespace }}" }} restart ~{{ "{{ $value | humanize }}" }} lần/10p (tb 3 phút)"
{{- end }}
