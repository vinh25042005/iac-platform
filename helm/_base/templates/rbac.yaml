apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly
  namespace: {{ include "base.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly-role
  namespace: {{ include "base.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-binding
  namespace: {{ include "base.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: readonly
    namespace: {{ include "base.namespace" . }}
roleRef:
  kind: Role
  name: readonly-role
  apiGroup: rbac.authorization.k8s.io
---
# ── SA cho Jenkins CI ────────────────────────────────────────────────────
# Jenkins xác thực vào Vault bằng Kubernetes auth qua SA này:
#   kubectl create token jenkins-ci -n <namespace> --audience=vault
#   vault login -method=kubernetes role=<vault-role>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci
  namespace: {{ include "base.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
