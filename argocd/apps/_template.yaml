# Application mẫu per (project × env) — MỌI project dùng CHUNG chart helm/_base,
# chỉ khác nhau ở values/<PROJECT>/values-<ENV>.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <PROJECT>-<ENV>
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<your-org>/iac-platform.git
    targetRevision: main
    path: helm/_base
    helm:
      valueFiles:
        - values/<PROJECT>/values.yaml
        - values/<PROJECT>/values-<ENV>.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: <PROJECT>-<ENV>
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
