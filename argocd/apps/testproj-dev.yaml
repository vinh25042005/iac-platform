apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testproj-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/<your-org>/iac-platform.git
    targetRevision: main
    path: helm/_base
    helm:
      valueFiles:
        - values/testproj/values.yaml
        - values/testproj/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: testproj-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
