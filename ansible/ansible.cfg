[defaults]
host_key_checking = False
interpreter_python = /usr/bin/python3
timeout = 60
retry_files_enabled = False
stdout_callback = yaml
roles_path = ./roles

# Inventory thường được truyền qua -i khi chạy (từng project×env).
# Giá trị mặc định chỉ dùng khi chạy ansible tay không có -i.
inventory = inventories/techshop-stg.ini

[ssh_connection]
# BẮT BUỘC cho worker private subnet (đi qua ProxyJump master):
# ForwardAgent=yes để key local được forward tới worker.
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
