---
# Role: master — Khởi tạo cluster với kubeadm init + Calico + upload SSM
# SSM path theo prefix <project>-<env> (group_vars/all.yml)

- name: Get private IP
  shell: hostname -I | awk '{print $1}'
  register: my_ip
  changed_when: false

- name: Get public IP (retry, may not be available immediately)
  shell: curl -s http://169.254.169.254/latest/meta-data/public-ipv4
  register: public_ip_raw
  changed_when: false
  retries: 30
  delay: 2
  until: public_ip_raw.stdout != ""

- name: Set IP facts
  set_fact:
    master_private_ip: "{{ my_ip.stdout }}"
    master_public_ip: "{{ public_ip_raw.stdout }}"

- name: Get AWS region
  shell: curl -s http://169.254.169.254/latest/meta-data/placement/region
  register: aws_region
  changed_when: false

- name: Delete old SSM parameters (avoid stale data)
  shell: |
    aws ssm delete-parameter --name "{{ ssm_prefix }}/join-command" --region {{ aws_region.stdout }} 2>/dev/null || true
    aws ssm delete-parameter --name "{{ ssm_prefix }}/worker-join-command" --region {{ aws_region.stdout }} 2>/dev/null || true
  changed_when: false

- name: Run kubeadm init
  shell: |
    kubeadm init \
      --control-plane-endpoint={{ master_private_ip }}:6443 \
      --apiserver-advertise-address={{ master_private_ip }} \
      --apiserver-cert-extra-sans={{ master_public_ip }} \
      --pod-network-cidr={{ pod_cidr }} \
      --kubernetes-version=v{{ k8s_version }}.0 2>&1 | tee /tmp/kubeadm-init.log
  args:
    creates: /etc/kubernetes/admin.conf

- name: Setup kubeconfig for ubuntu user
  shell: |
    mkdir -p $HOME/.kube
    cp /etc/kubernetes/admin.conf $HOME/.kube/config
    chown $(id -u):$(id -g) $HOME/.kube/config
  changed_when: false

- name: Patch kubeconfig with public IP (for remote access)
  shell: |
    sed -i "s/{{ master_private_ip }}/{{ master_public_ip }}/g" $HOME/.kube/config
  changed_when: false

- name: Install Calico CNI
  shell: |
    kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
  register: calico_result
  changed_when: "'created' in calico_result.stdout"

- name: Untaint master nodes (allow workload scheduling)
  shell: |
    kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true
  changed_when: false

- name: Wait for Calico to be ready
  shell: |
    kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n kube-system --timeout=120s
  changed_when: false

- name: Create worker join command
  shell: kubeadm token create --print-join-command
  register: worker_join_cmd
  changed_when: false

- name: Upload worker join command to SSM
  shell: |
    aws ssm put-parameter --name "{{ ssm_prefix }}/worker-join-command" \
      --value "{{ worker_join_cmd.stdout }}" \
      --type String --overwrite --region {{ aws_region.stdout }}
  changed_when: false

# ── Kubeconfig → VAULT (nguồn chuẩn — pipeline/terraform đọc từ Vault, KHÔNG dùng SSM) ──
#   KV v2 path: secret/k8s/<project>-<env>, key: kubeconfig (nội dung thô).
#   Cần truyền -e vault_addr=... -e vault_token=... từ terraform (new-project.sh ghi tfvars).
- name: Upload kubeconfig to Vault (KV v2 — nguồn chuẩn thay SSM)
  when: vault_token is defined and vault_token | default('') != ''
  shell: |
    PAYLOAD=$(jq -n --arg k "$(cat $HOME/.kube/config)" '{data:{kubeconfig:$k}}')
    curl -sk -X POST -H "X-Vault-Token: {{ vault_token }}" -H "Content-Type: application/json" \
      -d "$PAYLOAD" "{{ vault_addr }}/v1/secret/data/k8s/{{ project }}-{{ env }}" >/dev/null 2>&1
    KC=$(curl -sk -H "X-Vault-Token: {{ vault_token }}" "{{ vault_addr }}/v1/secret/data/k8s/{{ project }}-{{ env }}" | jq -r '.data.data.kubeconfig // empty' 2>/dev/null)
    [ -n "$KC" ] && echo ">>> Kubeconfig uploaded to Vault: secret/k8s/{{ project }}-{{ env }}" || echo "WARN: không push được kubeconfig lên Vault"
  changed_when: false

- name: Announce completion
  debug:
    msg: ">>> [MASTER] Cluster initialized! API: https://{{ master_public_ip }}:6443"
