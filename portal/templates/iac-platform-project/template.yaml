apiVersion: scaffolder.backstage.io/v1beta3
# =============================================================================
# Template: Tạo project mới trên iac-platform (giống màn hình "Create Project"
# của CatalogHub mentor). Chạy scripts/new-project.sh sinh toàn bộ scaffold:
#   terraform/environments/<project>/{dev,stg,prd}/
#   helm/_base/values/<project>/
#   argocd/apps/<project>-<env>.yaml
#   đăng ký vào projects.txt
# =============================================================================
kind: Template
metadata:
  name: iac-platform-project
  title: Create iac-platform Project
  description: Tạo project mới trên iac-platform — sinh Terraform environments, Helm values, ArgoCD apps (giống CatalogHub)
spec:
  owner: guests
  type: service

  parameters:
    - title: Project info
      required:
        - projectName
      properties:
        projectName:
          title: Project Name
          type: string
          description: Tên dự án (slug) — dùng cho namespace, tên resource, helm chart
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        envs:
          title: Environments
          type: array
          description: Danh sách môi trường sẽ sinh
          items:
            type: string
            enum: [dev, stg, prd]
          default: [dev, stg, prd]
          uniqueItems: true

  steps:
    # Bước 1: git clone repo iac-platform (GIỮ .git → push được lên GitHub).
    #   Dùng GITHUB_TOKEN từ env của backend (không nhúng vào command → không lộ log).
    #   Token qua credential.helper store (file cục bộ, xoá sau khi clone).
    - id: clone
      name: Clone iac-platform (git)
      action: run:script
      input:
        path: .
        useShell: true
        command: bash
        args:
          - -c
          - |
            set -e
            git init -q
            git remote add origin https://github.com/vinh25042005/iac-platform.git
            printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > .git-credentials
            git config credential.helper 'store --file=.git-credentials'
            git fetch origin main --depth 1
            git checkout -b main FETCH_HEAD
            rm -f .git-credentials

    # Bước 2: chạy new-project.sh với project name + envs (custom action run:script)
    #   Truyền ENVS qua field env (không nhúng vào command → tránh lỗi mất quotes)
    - id: run-generator
      name: Run new-project.sh
      action: run:script
      input:
        path: .
        command: ./scripts/new-project.sh
        args:
          - ${{ parameters.projectName }}
        env:
          ENVS: ${{ parameters.envs | join(' ') }}

    # Bước 3: commit + push project scaffold lên GitHub (dùng GITHUB_TOKEN từ env)
    - id: commit
      name: Commit & Push
      action: run:script
      input:
        path: .
        useShell: true
        command: bash
        args:
          - -c
          - |
            set -e
            git config user.name "backstage"
            git config user.email "backstage@iac-platform.local"
            printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > .git-credentials
            git config credential.helper 'store --file=.git-credentials'
            git add -A
            git commit -m "project: create ${{ parameters.projectName }} (via Backstage)" || true
            git push origin main
            rm -f .git-credentials

  output:
    links:
      - title: Open project
        url: http://localhost:3000
